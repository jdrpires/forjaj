version: '3.8'

services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:15
    container_name: forjaj_postgres
    environment:
      POSTGRES_DB: forjaj_db
      POSTGRES_USER: forjaj_user
      POSTGRES_PASSWORD: forjaj_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - forjaj_network

  # Backend Flask
  backend:
    build: ./backend
    container_name: forjaj_backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://forjaj_user:forjaj_password@postgres:5432/forjaj_db
      - JWT_SECRET_KEY=your-jwt-secret-key-here
      - FLASK_ENV=development
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    restart: unless-stopped
    networks:
      - forjaj_network

  # Frontend Next.js
  frontend:
    build: ./frontend
    container_name: forjaj_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - forjaj_network

volumes:
  postgres_data:
  uploads_data:

networks:
  forjaj_network:
    driver: bridge